name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt pytest

      - name: Tests
        run: python -m pytest tools/ -q

      - name: refresh_corpus.py --list against the fixture corpus
        env:
          SYNTHETIC_EXPERTS_CORPUS: tools/tests/fixtures/corpus
        run: |
          out="$(python tools/refresh_corpus.py --list)"
          echo "$out"
          test "$out" = "$(printf 'alpha-expert\nbeta-expert')"
